name: Daily Byte

on:
  schedule:
    # GitHub's cron is best-effort — during peak load a run is often delayed
    # by 10+ minutes to several hours, and sometimes dropped entirely. So we
    # take several passes through the morning at off-peak minutes (avoid :00).
    # Both the generator and the commit step are no-ops once the day already
    # has an article, so the extra runs are harmless.
    - cron: "7 11 * * *"    # ~7:07am ET
    - cron: "21 13 * * *"   # ~9:21am ET
    - cron: "41 15 * * *"   # ~11:41am ET
  workflow_dispatch:
    inputs:
      date:
        description: "Backfill a specific date (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/daily-byte-generator/package-lock.json

      - name: Install generator dependencies
        working-directory: tools/daily-byte-generator
        run: npm install

      - name: Generate today's article
        working-directory: tools/daily-byte-generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILY_BYTE_DATE: ${{ github.event.inputs.date }}
        run: node generate.mjs

      - name: Commit and push if there's new content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tech-news/data
          if git diff --cached --quiet; then
            echo "No new Daily Byte content today — nothing to commit."
          else
            git commit -m "Daily Byte: add today's article"
            git push
          fi
