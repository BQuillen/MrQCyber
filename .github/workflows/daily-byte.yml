name: Daily Byte

on:
  schedule:
    # Students start on this by 8:30am ET, so the article needs to be live
    # well before 8:00. GitHub's cron is best-effort (often delayed 10+ min
    # to hours, sometimes dropped), so we take four early passes and rely on
    # at least one landing in time. Times are UTC; ET equivalents shift an
    # hour between EDT (summer) and EST (winter) but all stay before 8am ET.
    # The generator and commit step both no-op once the day has an article.
    - cron: "41 9 * * *"    # ~5:41am EDT / 4:41am EST
    - cron: "19 10 * * *"   # ~6:19am EDT / 5:19am EST
    - cron: "57 10 * * *"   # ~6:57am EDT / 5:57am EST
    - cron: "33 11 * * *"   # ~7:33am EDT / 6:33am EST — last chance before 8
  workflow_dispatch:
    inputs:
      date:
        description: "Backfill a specific date (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/daily-byte-generator/package-lock.json

      - name: Install generator dependencies
        working-directory: tools/daily-byte-generator
        run: npm install

      - name: Generate today's article
        working-directory: tools/daily-byte-generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILY_BYTE_DATE: ${{ github.event.inputs.date }}
        run: node generate.mjs

      - name: Commit and push if there's new content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tech-news/data
          if git diff --cached --quiet; then
            echo "No new Daily Byte content today — nothing to commit."
          else
            git commit -m "Daily Byte: add today's article"
            git push
          fi
