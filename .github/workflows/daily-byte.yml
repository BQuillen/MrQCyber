name: Daily Byte

on:
  schedule:
    # Students start on this by 8:30am ET, so the article needs to be live
    # well before 8:00. GitHub's cron is best-effort — it drops individual
    # invocations under load, but rarely many in a row — so we take seven
    # passes every ~20 min through the early morning and rely on at least one
    # landing. Times are UTC; ET equivalents shift an hour between EDT and EST
    # but all stay before 8am ET. The generator and commit step both no-op
    # once the day already has an article, so the extra runs are harmless.
    - cron: "35 9 * * *"    # ~5:35am EDT / 4:35am EST
    - cron: "55 9 * * *"    # ~5:55am EDT / 4:55am EST
    - cron: "15 10 * * *"   # ~6:15am EDT / 5:15am EST
    - cron: "35 10 * * *"   # ~6:35am EDT / 5:35am EST
    - cron: "55 10 * * *"   # ~6:55am EDT / 5:55am EST
    - cron: "15 11 * * *"   # ~7:15am EDT / 6:15am EST
    - cron: "35 11 * * *"   # ~7:35am EDT / 6:35am EST — last chance before 8
  workflow_dispatch:
    inputs:
      date:
        description: "Backfill a specific date (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string

permissions:
  contents: write

# GitHub often batches a backlog of missed cron runs and fires them within
# seconds of each other. Without this, several runs generate the article in
# parallel and all but the first fail their `git push` with "fetch first".
# Serialize instead: one run at a time, later ones queue (GitHub keeps only
# the newest pending and cancels the rest cleanly), and each queued run then
# finds the day already done and no-ops.
concurrency:
  group: daily-byte
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/daily-byte-generator/package-lock.json

      - name: Install generator dependencies
        working-directory: tools/daily-byte-generator
        run: npm install

      - name: Generate today's article
        working-directory: tools/daily-byte-generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILY_BYTE_DATE: ${{ github.event.inputs.date }}
        run: node generate.mjs

      - name: Commit and push if there's new content
        env:
          DAILY_BYTE_DATE: ${{ github.event.inputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tech-news/data
          if git diff --cached --quiet; then
            echo "No new Daily Byte content today — nothing to commit."
            exit 0
          fi
          git commit -m "Daily Byte: add today's article"
          date="${DAILY_BYTE_DATE:-$(TZ=America/New_York date +%F)}"
          # concurrency: should prevent overlap, but a manual dispatch can still
          # race a scheduled run — if someone else published today's file first,
          # drop our commit; otherwise rebase and retry a couple of times.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; fetching latest origin/main."
            git fetch origin main
            if git cat-file -e "origin/main:tech-news/data/${date}.json" 2>/dev/null; then
              echo "Another run already published ${date}; discarding our commit."
              git reset --hard origin/main
              exit 0
            fi
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "::error::Could not push Daily Byte for ${date} after 3 attempts."
          exit 1
